<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Setty PMS Filer</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <script src="../msal-browser.min.js"></script>
  <style>
    :root {
      --navy: #003865;
      --navy-light: #0a4a7a;
      --bg: #1a1a1a;
      --panel: #232323;
      --border: #3a3a3a;
      --text: #f5f5f5;
      --muted: #999;
      --accent: #4a9eff;
      --success: #4ade80;
      --error: #f87171;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
    }
    .header {
      background: var(--navy);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header-logo {
      font-weight: 700;
      letter-spacing: 0.5px;
      font-size: 14px;
    }
    .header-sub {
      font-size: 11px;
      color: rgba(255,255,255,0.7);
      margin-left: auto;
    }
    .container { padding: 16px; }
    .view { display: none; }
    .view.active { display: block; }
    .doc-info {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 10px 12px;
      margin-bottom: 14px;
      font-size: 12px;
    }
    .doc-info .label { color: var(--muted); font-size: 11px; }
    .doc-info .filename { font-weight: 600; word-break: break-all; }
    .doc-info .doc-location { color: var(--muted); font-size: 11px; margin-top: 3px; word-break: break-all; }
    label {
      display: block;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input[type="text"], input[type="search"] {
      width: 100%;
      padding: 8px 10px;
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 4px;
      font-size: 13px;
      font-family: inherit;
    }
    input:focus { outline: none; border-color: var(--accent); }
    .field { margin-bottom: 14px; }
    .project-list {
      max-height: 260px;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--panel);
    }
    .project-row {
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
    }
    .project-row:last-child { border-bottom: none; }
    .project-row:hover { background: #2d2d2d; }
    .project-row.selected { background: var(--navy-light); }
    .project-row.suggested { border-left: 3px solid var(--accent); }
    .project-row .pn { color: var(--accent); font-weight: 600; font-size: 11px; }
    .project-row .nm { font-size: 12px; }
    .project-row .cl { color: var(--muted); font-size: 11px; }
    button {
      background: var(--navy);
      color: #fff;
      border: none;
      padding: 10px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      width: 100%;
      font-family: inherit;
    }
    button:hover:not(:disabled) { background: var(--navy-light); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      font-weight: 400;
      font-size: 12px;
      padding: 6px 10px;
      width: auto;
    }
    .status {
      margin-top: 10px;
      padding: 8px 10px;
      border-radius: 4px;
      font-size: 12px;
      display: none;
    }
    .status.info    { display: block; background: #1e3a5f; color: #93c5fd; }
    .status.success { display: block; background: #14532d; color: var(--success); }
    .status.error   { display: block; background: #3f1d1d; color: var(--error); }
    .suggested-badge {
      background: var(--accent);
      color: #000;
      font-size: 9px;
      padding: 1px 5px;
      border-radius: 2px;
      margin-left: 6px;
      font-weight: 700;
      vertical-align: middle;
    }
    .footer-link {
      margin-top: 12px;
      font-size: 11px;
      color: var(--muted);
      text-align: center;
    }
    .footer-link a { color: var(--accent); }
    .sp-picker {
      margin-top: 8px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--panel);
      padding: 8px 10px;
    }
    .sp-breadcrumbs {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 6px;
      word-break: break-all;
    }
    .sp-breadcrumbs span { color: var(--accent); cursor: pointer; }
    .sp-breadcrumbs span:hover { text-decoration: underline; }
    .sp-folders {
      max-height: 140px;
      overflow-y: auto;
    }
    .sp-folder-row {
      padding: 5px 6px;
      cursor: pointer;
      font-size: 12px;
      border-radius: 3px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .sp-folder-row:hover { background: #2d2d2d; }
    .sp-folder-row.up { color: var(--muted); }
    .sp-empty { color: var(--muted); font-size: 11px; padding: 4px 6px; }
    .sp-loading { color: var(--muted); font-size: 11px; padding: 4px 6px; font-style: italic; }
    .save-section {
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 12px;
      margin-top: 14px;
      background: rgba(255,255,255,0.02);
    }
    .save-section-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    .save-section-sub {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .save-section-sub code {
      background: var(--panel);
      padding: 1px 5px;
      border-radius: 2px;
      font-size: 10px;
    }
    .insert-row {
      display: flex;
      gap: 6px;
    }
    .btn-insert {
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 12px;
      font-weight: 500;
      padding: 8px 10px;
      flex: 1;
    }
    .btn-insert:hover:not(:disabled) {
      background: #2d2d2d;
      border-color: var(--accent);
    }
    .poc-list {
      max-height: 200px;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--panel);
      margin-top: 6px;
    }
    .poc-group-header {
      font-size: 10px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 6px 10px 2px;
      background: rgba(0,0,0,0.2);
      border-bottom: 1px solid var(--border);
    }
    .poc-row {
      padding: 7px 10px;
      cursor: pointer;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
    }
    .poc-row:last-child { border-bottom: none; }
    .poc-row:hover { background: #2d2d2d; }
    .poc-row .poc-name { font-weight: 600; }
    .poc-row .poc-meta { color: var(--muted); font-size: 11px; }
    .poc-empty { padding: 10px; color: var(--muted); font-size: 11px; text-align: center; }
    /* Compact selected-project pill */
    .project-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 6px 10px;
      font-size: 12px;
    }
    .project-pill .pn { color: var(--accent); font-weight: 700; }
    .project-pill .nm { flex: 1; color: var(--text); }
    .project-pill .change-link {
      color: var(--accent);
      cursor: pointer;
      font-size: 11px;
      text-decoration: underline;
    }
    /* Save row — two buttons side by side at the top */
    .save-row {
      display: flex;
      gap: 6px;
      margin-top: 10px;
    }
    .save-row button { flex: 1; padding: 9px 8px; font-size: 12px; }
    /* Tight option line under each save button (title for OneNote, folder for SP) */
    .opt-line {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--muted);
      padding: 4px 2px;
      flex-wrap: wrap;
    }
    .opt-line .opt-current { color: var(--text); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .opt-line .opt-link { color: var(--accent); cursor: pointer; text-decoration: underline; flex-shrink: 0; }
    .opt-edit { display: none; margin-top: 4px; }
    .opt-edit.active { display: block; }
    /* Section heading reused but tighter */
    .section-tight { margin-top: 14px; }
    .section-tight .save-section-title { margin-bottom: 6px; }
    /* Quick project links — shown below the pill */
    .quick-links-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-top: 4px;
      margin-bottom: 8px;
    }
    .btn-quick-link {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 11px;
      padding: 4px 6px;
      border-radius: 4px;
      cursor: pointer;
      font-family: inherit;
      font-weight: 500;
      width: 100%;
    }
    .btn-quick-link:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
    .btn-quick-link:disabled { opacity: 0.35; cursor: not-allowed; }
    /* Destination card — shows save target before clicking Save */
    .dest-display {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 7px 10px;
      font-size: 12px;
      margin-bottom: 4px;
      color: var(--muted);
    }
    .dest-path { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
    .dest-change-btn {
      flex-shrink: 0; background: transparent; border: none;
      color: var(--accent); font-size: 11px; font-weight: 600;
      cursor: pointer; padding: 0; text-decoration: underline; font-family: inherit; width: auto;
    }
    .dest-change-btn:hover { color: #7cb9ff; }
    /* Title field — visible labeled input, not hidden behind an opt-line */
    .title-field { margin-bottom: 8px; }
    .title-field label { margin-bottom: 3px; }

    /* ── Document status bar ───────────────────────────────────────────── */
    .status-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 4px;
      margin-bottom: 10px;
      font-size: 12px;
      user-select: none;
    }
    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .status-label-text { font-weight: 600; flex: 1; }
    .status-hint { font-size: 11px; color: var(--muted); }
    /* Done-editing section */
    .done-section {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 8px 10px;
      margin-bottom: 10px;
      font-size: 12px;
    }
    .done-section-header {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
    }
    .done-section-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
      flex: 1;
    }
    .done-toggle-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 3px;
      cursor: pointer;
      font-family: inherit;
      width: auto;
    }
    .done-toggle-btn:hover { border-color: var(--accent); color: var(--accent); }
    .done-toggle-btn.is-done { border-color: #166534; color: #4ade80; background: rgba(74,222,128,0.08); }
    .done-toggle-btn.is-done:hover { background: rgba(74,222,128,0.15); }
    .done-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 3px 0;
      font-size: 12px;
      color: var(--muted);
    }
    .done-item .done-check { color: #4ade80; font-size: 11px; flex-shrink: 0; }
    .done-item .done-name  { flex: 1; color: var(--text); }
    .done-item .done-time  { font-size: 10px; color: var(--muted); }
    .done-empty { font-size: 11px; color: var(--muted); font-style: italic; }
    /* PDF button — full width, below the main save row */
    #savePdfBtn {
      margin-top: 6px;
      background: #14532d;
      color: #4ade80;
      border: 1px solid #166534;
    }
    #savePdfBtn:hover:not(:disabled) { background: #166534; }
    #savePdfBtn:disabled { opacity: 0.4; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-logo">SETTY PMS</div>
    <div class="header-sub">Word → OneNote</div>
  </div>

  <div class="container">

    <div id="signInView" class="view">
      <p style="color:var(--muted);font-size:12px;">Sign in with your Setty Microsoft account to send this document to a project.</p>
      <button id="signInBtn">Sign in</button>
      <div id="signInStatus" class="status"></div>
    </div>

    <div id="mainView" class="view">
      <div class="doc-info">
        <div class="label">DOCUMENT</div>
        <div class="filename" id="docFilename">Loading…</div>
        <div class="doc-location" id="docLocation" style="display:none"></div>
      </div>

      <!-- Document name — used for all save operations -->
      <div id="titleFieldWrap" class="title-field">
        <label for="titleInput">Document Name</label>
        <input type="text" id="titleInput" placeholder="Document name" />
      </div>

      <!-- Destination — save location; updates as folder is browsed -->
      <div id="destCard" style="display:none; margin-bottom:8px;">
        <div class="dest-display">
          <span>📂</span>
          <span class="dest-path" id="destFolderDisplay">project root</span>
          <button id="destChangeBtn" class="dest-change-btn">✏ change</button>
        </div>
        <div class="opt-edit" id="spFolderEdit">
          <div class="sp-picker" style="margin-top:0">
            <div class="sp-breadcrumbs" id="spBreadcrumbs">Pick a project first.</div>
            <div class="sp-folders" id="spFolders"></div>
          </div>
        </div>
      </div>

      <!-- Document status — set automatically when PDF is exported -->
      <div class="status-bar" id="statusBar">
        <span class="status-dot" id="statusDot"></span>
        <span class="status-label-text" id="statusLabelText">Draft</span>
        <span class="status-hint" id="statusHint"></span>
      </div>

      <!-- Done-editing checklist — kept as a sign-off record after Final -->
      <div id="doneEditingSection" class="done-section" style="display:none">
        <div class="done-section-header">
          <span class="done-section-label">Done editing</span>
          <button id="toggleDoneBtn" class="done-toggle-btn">Mark me done</button>
        </div>
        <div id="doneEditingList"><div class="done-empty">No one has marked done yet.</div></div>
      </div>

      <!-- Project: search + list (visible until selection), then collapses to a compact pill -->
      <div id="projectPickerWrap">
        <div id="projectSearchWrap" class="field">
          <label for="searchInput">Project</label>
          <input type="search" id="searchInput" placeholder="Search by number, name, or client…" autocomplete="off" />
          <div class="project-list" id="projectList"></div>
        </div>
        <div id="projectPill" class="project-pill" style="display:none">
          <span class="pn" id="pillProjectNumber"></span>
          <span class="nm" id="pillProjectName"></span>
          <span class="change-link" id="pillChangeLink">change</span>
        </div>
        <!-- Quick links — visible with the pill, hidden during search -->
        <div id="projectQuickLinks" class="quick-links-row" style="display:none">
          <button id="openPmsBtn" class="btn-quick-link" disabled>🔗 Open in PMS</button>
          <button id="openSpFolderBtn" class="btn-quick-link" disabled>📂 SP Folder</button>
        </div>
      </div>

      <!-- Save row — two buttons side by side, prominent and at the top -->
      <div class="save-row">
        <button id="saveOneNoteBtn" disabled>Save to OneNote</button>
        <button id="saveSpDraftBtn" disabled>💾 Save Draft</button>
      </div>
      <button id="savePdfBtn" disabled>📄 Export PDF to SharePoint</button>

      <div id="oneNoteStatus" class="status"></div>
      <div id="oneNoteLink" class="footer-link"></div>
      <div id="spStatus" class="status"></div>
      <div id="spLink" class="footer-link"></div>

      <!-- Insert: smaller, lower in the pane since saves are the primary action -->
      <div class="section-tight">
        <div class="save-section-title">Insert at cursor</div>
        <div class="insert-row">
          <button id="insertNameBtn" class="btn-insert" disabled>Project Name</button>
          <button id="insertNumberBtn" class="btn-insert" disabled>Project Number</button>
        </div>
        <div class="insert-row" style="margin-top:6px">
          <button id="insertClientBtn" class="btn-insert" disabled>Client Name</button>
          <button id="insertPocToggleBtn" class="btn-insert" disabled>POC Block…</button>
        </div>
        <div id="pocPicker" style="display:none;margin-top:8px">
          <input type="search" id="pocSearch" placeholder="Search by name, company, email…" autocomplete="off" />
          <div class="poc-list" id="pocList"></div>
        </div>
        <div id="insertStatus" class="status"></div>
      </div>

      <div style="margin-top:14px;text-align:center">
        <button id="signOutBtn" class="btn-secondary">Sign out</button>
      </div>
    </div>

  </div>

  <script src="taskpane.js"></script>
</body>
</html>
