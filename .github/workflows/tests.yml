# Runs the unit tests and a syntax check on every pull request and on main.
#
# Nothing here deploys (GitHub Pages serves main on its own). To make a red run
# actually BLOCK a merge, mark the "test" check as required: GitHub -> repo
# Settings -> Branches (or Rules) -> main -> require status checks -> "test".
name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unit tests
        run: node --test *.test.mjs

      # taskpane.js is the whole add-in; a syntax error is a blank pane for everyone.
      - name: taskpane.js parses
        run: node --check taskpane.js
